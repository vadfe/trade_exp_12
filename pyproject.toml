[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-exp-12"
version = "0.1.0"
description = "Market state research platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "PyYAML>=6.0,<7",
    "pandas>=2.3,<3",
    "pyarrow>=20,<24",
    "python-multipart>=0.0.20,<1",
    "smartmoneyconcepts==0.0.27",
    "plotly==6.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[project.scripts]
trade-exp = "trade_exp_12.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
